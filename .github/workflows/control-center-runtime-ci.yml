name: Control Center Runtime CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  control-center-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0
      - name: Validate package contract
        run: |
          cd services/control-center
          bun run --silent start >/tmp/control-center.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/health >/tmp/control-center-health.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
      - name: Build Control Center
        run: bun build services/control-center/index.ts --target=bun --outfile=/tmp/control-center.js
