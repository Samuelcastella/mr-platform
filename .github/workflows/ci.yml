name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prueba de humo del storefront
        working-directory: web/storefront
        run: npm test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PORT: 3011
      API_BASE_URL: http://127.0.0.1:3011
      INTERNAL_API_TOKEN: ci-internal-token
      ORDER_RESERVATION_TTL_MINUTES: 30
      ALLOW_DESTRUCTIVE_TEST_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Validar Catalog API
        run: bun build services/catalog-api/index.ts --target=bun --outfile=/tmp/catalog-api.js
      - name: Validar rutas internas
        run: bun build services/catalog-api/internal-routes.ts --target=bun --outfile=/tmp/internal-routes.js
      - name: Validar módulo de catálogo interno
        run: bun build services/catalog-api/catalog-internal.ts --target=bun --outfile=/tmp/catalog-internal.js
      - name: Validar portal de proveedores
        run: bun build services/catalog-api/vendor-portal.ts --target=bun --outfile=/tmp/vendor-portal.js
      - name: Validar módulo de órdenes
        run: bun build services/catalog-api/orders.ts --target=bun --outfile=/tmp/orders.js
      - name: Validar módulo de checkout
        run: bun build services/catalog-api/checkout.ts --target=bun --outfile=/tmp/checkout.js
      - name: Validar módulo de fulfillment
        run: bun build services/catalog-api/fulfillment.ts --target=bun --outfile=/tmp/fulfillment.js
      - name: Validar módulo de identidad y seguridad
        run: bun build services/catalog-api/auth.ts --target=bun --outfile=/tmp/auth.js
      - name: Validar módulo de Customer CRM
        run: bun build services/catalog-api/customers.ts --target=bun --outfile=/tmp/customers.js
      - name: Prueba de integración órdenes + reservas
        shell: bash
        run: |
          set -euo pipefail
          bun run services/catalog-api/index.ts >/tmp/catalog-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3011/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3011/health >/dev/null || { cat /tmp/catalog-api.log; exit 1; }
          bun run services/catalog-api/test/orders.integration.ts
          bun run services/catalog-api/test/checkout.integration.ts
          bun run services/catalog-api/test/fulfillment.integration.ts
          bun run services/catalog-api/test/auth.integration.ts
          bun run services/catalog-api/test/rbac-internal.integration.ts
          bun run services/catalog-api/test/catalog.integration.ts
          bun run services/catalog-api/test/vendor-portal.integration.ts
          bun run services/control-center/test/integration.ts
          bun run services/catalog-api/test/customers.integration.ts
      - name: Validar Control Center
        run: bun build services/control-center/index.ts --target=bun --outfile=/tmp/control-center.js


  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Instalar dependencias mobile
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Exportar bundle Android
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir /tmp/mr-mobile-dist
