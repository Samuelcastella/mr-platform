const products=[['Bolso urbano','Accesorios',790,'👜'],['Cuidado personal','Belleza',480,'✨'],['Mochila Pro','Escolar',650,'🎒'],['Audífonos','Tecnología',980,'🎧'],['Camiseta','Ropa',320,'👕'],['Calzado casual','Calzado',890,'👟'],['Organizador','Hogar',540,'🏠'],['Set fitness','Deportes',1190,'🏋️']].map((x,i)=>({id:'p'+i,name:x[0],dept:x[1],price:x[2],icon:x[3]}));
const money=n=>'L '+n.toLocaleString('es-HN'),cart=()=>JSON.parse(localStorage.mrCart||'[]'),save=c=>{localStorage.mrCart=JSON.stringify(c);count()},go=x=>location.hash='#/'+x;
const favs=()=>JSON.parse(localStorage.mrFavs||'[]');function toggleFav(btn,id){let f=favs(),on=f.includes(id);f=on?f.filter(x=>x!==id):f.concat(id);localStorage.mrFavs=JSON.stringify(f);btn.setAttribute('aria-pressed',String(!on));btn.setAttribute('aria-label',!on?'Quitar de favoritos':'Agregar a favoritos');btn.textContent=!on?'♥':'♡';announce(!on?'Guardado en favoritos':'Eliminado de favoritos')}
function searchProducts(e){e.preventDefault();let q=(document.querySelector('#searchInput')?.value||'').trim().toLowerCase();location.hash='#/catalog';setTimeout(()=>{let list=!q?products:products.filter(p=>(p.name+' '+p.dept).toLowerCase().includes(q));let g=document.querySelector('#catalog-grid'),n=document.querySelector('#results');if(g)g.innerHTML=cards(list);if(n)n.textContent=list.length+' '+(list.length===1?'resultado':'resultados')+(q?' para “'+q+'”':'');announce(list.length?'Búsqueda actualizada':'No se encontraron productos')},0)}
function count(){let e=document.querySelector('#count');if(e)e.textContent=cart().reduce((a,x)=>a+x.q,0)}
function announce(t){status.textContent=t;status.hidden=false;clearTimeout(window.st);window.st=setTimeout(()=>status.hidden=true,2200)}function add(id){let s=stockData(),c=cart(),x=c.find(v=>v.id===id),q=x?x.q:0;if((s[id]||0)<=q){announce('No hay más unidades disponibles');return}x?x.q++:c.push({id,q:1});save(c);announce('Producto agregado al carrito')}
function openProduct(id){location.hash='#/product/'+id} function cards(list=products){let s=stockData(),f=favs();if(!list.length)return '<div class="panel empty"><h2>No encontramos productos</h2><p>Prueba otra categoría o una búsqueda diferente.</p><button class="small" onclick="go(\'catalog\')">Ver todo el catálogo</button></div>';return '<div class="grid">'+list.map(p=>'<article class="card"><div class="photo" aria-hidden="true">'+p.icon+'</div><div class="body"><div class="meta">'+p.dept+'</div><h3><button style="all:unset;cursor:pointer;font:inherit;font-weight:700" onclick="openProduct(\''+p.id+'\')">'+p.name+'</button></h3><div class="stock '+(p.id==='p1'?'low':'')+'">'+(p.id==='p1'?'Pocas unidades':'Disponible')+'</div><div class="row"><b>'+money(p.price)+'</b><span style="display:flex;gap:8px;align-items:center"><button class="fav" aria-label="'+(f.includes(p.id)?'Quitar de favoritos':'Agregar a favoritos')+'" aria-pressed="'+f.includes(p.id)+'" onclick="toggleFav(this,\''+p.id+'\')">'+(f.includes(p.id)?'♥':'♡')+'</button><button class="small" '+(s[p.id]===0?'disabled aria-disabled="true"':'')+' onclick="add(\''+p.id+'\')">Agregar</button></span></div></div></article>').join('')+'</div>'}
function home(){return '<section class="hero" aria-labelledby="hero-title"><div class="hero-display"><div class="orb" aria-hidden="true"></div><div class="crown3d" id="crown3d"><img class="crown3d-fallback" src="/assets/crown.png" alt="Corona de MR עדולם"><span class="crown3d-hint" aria-hidden="true">Arrastra para girar</span></div></div><div class="copy"><div class="eyebrow">MR עדולם · Plataforma comercial</div><h1 id="hero-title">Una marca preparada para crecer.</h1><p>Una experiencia digital para descubrir productos, colecciones y nuevas categorías sin limitar la marca a un solo nicho.</p><div class="cta"><button class="primary" onclick="go(\'catalog\')">Explorar catálogo</button><button class="secondary" onclick="go(\'market\')">Marketplace</button></div></div></section><section class="section"><div class="head"><div><h2>Explora por categoría</h2><p>Una arquitectura preparada para ampliar el catálogo.</p></div></div><div class="rail">'+['Ropa','Accesorios','Belleza','Niños','Hogar','Tecnología','Escolar','Deportes'].map(x=>'<button class="cat" onclick="sessionStorage.mrCat=\''+x+'\';go(\'catalog\')"><b>'+x+'</b><span>Explorar →</span></button>').join('')+'</div></section><section class="benefits"><div class="benefit"><b>Envíos en Honduras</b><span>Entrega local</span></div><div class="benefit"><b>Pagos seguros</b><span>Efectivo, transferencia y más</span></div><div class="benefit"><b>Productos propios</b><span>Selección MR עדולם</span></div><div class="benefit"><b>Marcas de terceros</b><span>Catálogo ampliable</span></div><div class="benefit"><b>Más mercados</b><span>Preparado para crecer</span></div></section><section class="section"><div class="head"><div><h2>Productos destacados</h2><p>Selección inicial del catálogo.</p></div></div>'+cards(products.slice(0,4))+'</section>'}
function catalog(){let selected=sessionStorage.mrCat||'Todos';sessionStorage.removeItem('mrCat');let cats=['Todos',...new Set(products.map(p=>p.dept))];return '<section><div class="head"><div><div class="eyebrow">Catálogo</div><h2>Todos los productos</h2><p>Filtra el catálogo por categoría.</p></div></div><div class="filters" aria-label="Filtrar productos">'+cats.map(x=>'<button class="filter" aria-pressed="'+(x===selected)+'" onclick="filterProducts(this,\''+x+'\')">'+x+'</button>').join('')+'</div><p class="results" id="results" role="status">'+(selected==='Todos'?products:products.filter(p=>p.dept===selected)).length+' productos</p><div id="catalog-grid">'+cards(selected==='Todos'?products:products.filter(p=>p.dept===selected))+'</div></section>'}
function filterProducts(btn,cat){document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true');let list=cat==='Todos'?products:products.filter(p=>p.dept===cat);document.querySelector('#catalog-grid').innerHTML=cards(list);document.querySelector('#results').textContent=list.length+' '+(list.length===1?'producto':'productos');announce('Filtro '+cat+' aplicado')}
function addQty(id){let q=Math.max(1,Number(document.querySelector('#qty')?.value||1)),s=stockData(),c=cart(),x=c.find(v=>v.id===id),available=Math.max(0,(s[id]||0)-(x?x.q:0));if(!available){announce('Producto agotado o máximo disponible alcanzado');return}q=Math.min(q,available);x?x.q+=q:c.push({id,q});save(c);announce(q+' '+(q===1?'unidad agregada':'unidades agregadas')+' al carrito')}
function productView(id){let p=products.find(x=>x.id===id),seller=sellerData()[id],s=stockData(),available=s[id]||0;if(!p)return simple('Producto no encontrado','Este producto no está disponible.');let opts=Array.from({length:Math.min(5,available)},(_,i)=>'<option>'+(i+1)+'</option>').join('');return '<section class="panel"><button class="small" onclick="go(\'catalog\')">← Volver al catálogo</button><div class="photo" style="max-width:440px;margin:20px 0;border-radius:22px" aria-hidden="true">'+p.icon+'</div><div class="meta">'+p.dept+'</div><h2>'+p.name+'</h2><p><span class="badge">'+seller.type+'</span> <span class="meta">Origen: '+seller.origin+'</span></p><p class="price"><b>'+money(p.price)+'</b></p><p class="stock '+(available<=3?'low':'')+'">'+(available===0?'Agotado':available<=3?'Pocas unidades · '+available:'Disponible · '+available+' unidades')+'</p><p>Producto de demostración preparado para incorporar descripción, variantes, inventario, envío y especificaciones.</p><div class="product-actions"><label for="qty"><b>Cantidad</b></label><select id="qty" class="qty" aria-label="Cantidad" '+(available===0?'disabled':'')+'>'+opts+'</select><button class="primary" style="background:#111;color:#fff" '+(available===0?'disabled aria-disabled="true"':'')+' onclick="addQty(\''+p.id+'\')">'+(available===0?'Agotado':'Agregar al carrito')+'</button></div><div class="delivery"><b>Entrega en Honduras</b><span>Opciones de entrega y retiro se calcularán al confirmar el pedido.</span></div></section>'}
function changeQty(id,d){let c=cart(),x=c.find(v=>v.id===id),s=stockData();if(!x)return;if(d>0&&x.q>=(s[id]||0)){announce('Máximo disponible alcanzado');return}x.q+=d;if(x.q<=0)c=c.filter(v=>v.id!==id);save(c);render();announce(d>0?'Cantidad aumentada':'Cantidad actualizada')}function removeItem(id){save(cart().filter(x=>x.id!==id));render();announce('Producto eliminado del carrito')}

function confirmOrder(){let orders=JSON.parse(localStorage.mrOrders||'[]'),d=JSON.parse(sessionStorage.mrCheckout||'{}'),items=cart(),s=stockData();if(items.some(x=>(s[x.id]||0)<x.q)){announce('El inventario cambió. Revisa el carrito.');go('cart');return}items.forEach(x=>s[x.id]-=x.q);localStorage.mrStock=JSON.stringify(s);let id='MR-'+Date.now().toString().slice(-6);let order={id,date:new Date().toISOString(),status:'Recibido',customer:d,items};orders.unshift(order);localStorage.mrOrders=JSON.stringify(orders);sessionStorage.mrLastOrder=JSON.stringify(order);localStorage.removeItem('mrCart');sessionStorage.removeItem('mrCheckout');count();announce('Pedido '+id+' confirmado');setTimeout(()=>go('success'),500)}

'+limit+'" onchange="setLowStockLimit(this.value)"></label></div></div>'+low.map(p=>'<div class="row cart-line"><span><b>'+p.name+'</b><br><span class="meta">'+p.dept+'</span></span><span class="inventory-status low">'+stock[p.id]+' unidades</span></div>').join('')+'</div>':'')+'<div class="panel"><h3>Inventario y catálogo</h3><p id="inventoryResults" class="results" role="status">'+products.length+' productos visibles</p>'+products.map(p=>'<div class="row cart-line" data-stock-state="'+((stock[p.id]||0)===0?'Agotado':(stock[p.id]||0)<=limit?'Bajo':'Disponible')+'"><span><b>'+p.name+'</b><br><span class="meta">'+p.dept+' · '+money(p.price)+' · '+sellers[p.id].type+'</span><br><span class="meta">Costo '+money(commerce[p.id].cost)+' · Margen '+Math.round((p.price-commerce[p.id].cost)/p.price*100)+'% · Comisión '+commerce[p.id].commission+'%</span><div class="admin-actions" style="margin-top:8px"><label><span class="meta">Tipo</span><select class="qty" onchange="updateSeller(\''+p.id+'\',\'type\',this.value)">'+['MR עדולם','Marca asociada','Proveedor externo'].map(v=>'<option '+(sellers[p.id].type===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label><span class="meta">Origen</span><input class="qty" style="width:130px" value="'+sellers[p.id].origin+'" onchange="updateSeller(\''+p.id+'\',\'origin\',this.value.trim()||\'Sin definir\')"></label><label><span class="meta">Costo</span><input class="qty" style="width:100px" type="number" min="0" value="'+commerce[p.id].cost+'" onchange="updateCommerce(\''+p.id+'\',\'cost\',this.value)"></label><label><span class="meta">Comisión %</span><input class="qty" style="width:86px" type="number" min="0" max="100" value="'+commerce[p.id].commission+'" onchange="updateCommerce(\''+p.id+'\',\'commission\',this.value)"></label></div></span><div class="admin-actions"><span class="inventory-status '+(stock[p.id]<=limit?'low':'ok')+'">'+stock[p.id]+' en stock'+(stock[p.id]<=limit?' · Bajo':'')+'</span><button class="small" function accountView(){let f=favs(),os=[];try{os=JSON.parse(localStorage.mrOrders||'[]')}catch{};return '<section><div class="head"><div><div class="eyebrow">Mi cuenta</div><h2>Tu espacio MR עדולם</h2><p>Compras y productos guardados en un solo lugar.</p></div></div><div class="metrics"><div class="metric"><span>Pedidos</span><b>'+os.length+'</b></div><div class="metric"><span>Favoritos</span><b>'+f.length+'</b></div><div class="metric"><span>Pedidos activos</span><b>'+os.filter(o=>!['Entregado','Cancelado'].includes(o.status)).length+'</b></div><div class="metric"><span>Entregados</span><b>'+os.filter(o=>o.status==='Entregado').length+'</b></div></div><div class="panel"><h3>Favoritos</h3>'+(f.length?cards(products.filter(p=>f.includes(p.id))):'<div class="empty"><p>Aún no has guardado productos.</p><button class="small" onclick="go(\'catalog\')">Explorar catálogo</button></div>')+'</div><div class="panel" style="margin-top:18px"><h3>Accesos rápidos</h3><div class="product-actions"><button class="small" onclick="go(\'orders\')">Mis pedidos</button><button class="small" onclick="go(\'cart\')">Mi carrito</button><button class="small" onclick="go(\'catalog\')">Catálogo</button></div></div></section>'}
