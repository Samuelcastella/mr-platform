/* ===== Rediseño oscuro / dorado (maqueta Elegante tienda MR) ===== */
:root{--gold:#d4af37;--gold2:#e0bd6c;--goldsoft:#d8b46a;--line-dark:#2c2923}
body{overflow-x:hidden;background:linear-gradient(#f1e9db,#f6f1e8 420px,#f5f0e7)}
main{max-width:1400px;padding-top:22px}
.utility{background:#0b0b0b;color:#e9e1d0;padding:0 clamp(12px,3vw,40px);font-size:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:34px;border-bottom:1px solid var(--line-dark)}
.utility .u-left,.utility .u-right{display:flex;align-items:center;gap:6px}.utility .u-right{justify-content:flex-end;gap:6px}
.u-mid{display:flex}.u-mid b{font-weight:400;padding:0 22px;border-left:1px solid #5a5446}.u-mid b:first-child{border:0}
.utility i{font-style:normal;font-size:11px;opacity:.8}.utility em{font-style:normal;margin-left:30px;display:inline-flex;align-items:center;gap:6px}
header{background:#0b0b0b;border-bottom:1px solid #a9873a;backdrop-filter:none;display:grid;grid-template-columns:150px minmax(0,1fr) auto;column-gap:0;padding:0 clamp(12px,3vw,40px)}
.top{display:contents}
.brand{grid-column:1;grid-row:1/3;align-self:center;padding:8px 0;min-width:0;text-align:left;color:inherit}
.brand .crown{width:78px;height:auto;margin:0;filter:none}
.search{grid-column:2;grid-row:1;justify-self:stretch;margin:14px 28px 0 0;background:#141414;border:1px solid #6e5b2f;border-radius:999px;color:#d9cfb8;min-height:48px;padding:0 20px;gap:12px}
.search input{width:100%;flex:1;color:#f1e9d8;font-size:14px}.search input::placeholder{color:#9d947f}
.actions{grid-column:3;grid-row:1;margin-top:14px;gap:4px;justify-self:end;align-items:center}
.act{background:none;border:0;color:#f1e9d8;display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;min-height:44px;position:relative;border-radius:8px}
.act:hover{background:#1a1a1a}
.cartbtn b{position:absolute;top:0;left:28px;background:var(--gold2);color:#111;border-radius:50%;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 4px}
nav{grid-column:2/4;grid-row:2;justify-content:flex-start;gap:4px;padding:6px 0 0;overflow:auto}
nav a{color:#f1e9d8;font-weight:500;font-size:14px;padding:0 18px;min-height:44px;border-radius:3px 3px 0 0;text-decoration:none}
nav a.has:after{content:"⌄";margin-left:8px;font-size:12px;opacity:.8}
nav a:hover,nav a:focus-visible{background:#1a1a1a;text-decoration:none}
nav a[aria-current="page"]{background:#d9b86f;color:#111;text-decoration:none}
a:focus-visible,button:focus-visible{outline-color:var(--gold2)}
header a:focus-visible,header button:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

  background:radial-gradient(ellipse at 18% 40%,#2b2620 0,transparent 55%),radial-gradient(circle at 82% 15%,#5a4521 0,transparent 36%),repeating-linear-gradient(115deg,#0c0c0c 0 46px,#151311 46px 92px),#0b0b0b}
.hero.hero2:after{display:none}
.hero-brand{display:flex;flex-direction:column;align-items:center;gap:4px}
.hero-brand .hero-display{position:relative;inset:auto;right:auto;top:auto;width:100%;max-width:360px;height:175px}
.hb-mr{height:128px;width:auto;max-width:100%}.hb-he{height:50px;width:auto;margin-top:8px}
.hero2 .copy{max-width:none}
.hero2 h1{font-family:Georgia,serif;font-weight:700;font-size:clamp(34px,4vw,58px);line-height:1.06;margin:0;color:#fff}
.hero2 h1 span{display:block}.hero2 h1 .g{color:#dcb867}
.hero2 .rule{display:block;width:72px;height:2px;background:var(--gold);margin:20px 0}
.hero2 p{font-size:17px;max-width:360px;margin:0 0 22px;color:#ece3d1}
.primary.gold{background:linear-gradient(#e8c877,#c9a14a);color:#17120a;border:0;border-radius:8px;padding:0 24px;font-weight:700;display:inline-flex;gap:10px;align-items:center;box-shadow:0 6px 18px #0006}
.hero2 .crown3d-hint{display:none}.hero-show .showcase{position:relative;inset:auto;transform:none;grid-template-columns:repeat(2,1fr);gap:14px}
.hero-show .showcase i{height:112px;font-size:46px}

.catrail{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin-top:20px}
.cat2{border:0;padding:0;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 6px 18px #2c241418;text-align:left;color:#171513;cursor:pointer;transition:transform .2s,box-shadow .2s}
.cat2:hover{transform:translateY(-3px);box-shadow:0 12px 26px #2c241426}
.cat2 .ph{display:grid;place-items:center;height:92px;font-size:40px;background:linear-gradient(145deg,#efe4d1,#cbb68d)}
.cat2 .lb{display:flex;justify-content:space-between;align-items:center;padding:12px 12px;font-size:13px}
.cat2 .lb b{font-weight:500}
.cat2.offer .ph{background:linear-gradient(145deg,#ecd592,#bf9a45)}
.benefits2{display:grid;grid-template-columns:repeat(5,1fr);margin-top:22px;border-top:1px solid #e0d6c5;border-bottom:1px solid #e0d6c5}
.benefit2{display:flex;gap:14px;align-items:center;padding:18px 20px;border-left:1px solid #e0d6c5;color:#222}
.benefit2:first-child{border-left:0}.benefit2 b{display:block;font-size:14px}.benefit2 span{display:block;font-size:12px;color:#5a544b;margin-top:2px}
.featured .head h2{font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:26px}
.seeall{color:#171513;text-decoration:underline;font-weight:600;white-space:nowrap}
.featured .grid{grid-template-columns:repeat(6,1fr);gap:14px}
.featured .card{border-radius:6px}
.photo{position:relative}
.badge{position:absolute;right:10px;bottom:10px;font-size:11px;font-style:normal;padding:5px 12px;border-radius:999px;background:#fff;color:#111}
.badge.b0{background:#efe5d2}.badge.b1{background:#111;color:#fff}.badge.b2{background:#fff}

@media(max-width:1100px){.catrail{grid-template-columns:repeat(4,1fr)}.benefits2{grid-template-columns:repeat(2,1fr)}.benefit2:nth-child(odd){border-left:0}.featured .grid{grid-template-columns:repeat(3,1fr)}.hero.hero2{grid-template-columns:1fr 1fr}.hero-show{display:none}}
@media(max-width:760px){
 .utility{grid-template-columns:1fr}.utility .u-mid,.utility .u-right{display:none}
 header{grid-template-columns:96px minmax(0,1fr)}
 .brand{grid-row:1}.brand .crown{width:64px}.actions{grid-column:2;margin-top:0;gap:0}.act span{display:none}.cartbtn b{left:30px}
 nav{grid-column:1/-1;grid-row:2}
 .search{display:none}
 .hero.hero2{grid-template-columns:1fr;text-align:center;padding:28px 18px;min-height:0;gap:18px}
 .hero2 .rule{margin:16px auto}.hero2 p{margin-left:auto;margin-right:auto}
 .hero-brand .hero-display{height:150px}.hb-mr{height:96px}.hb-he{height:40px}
 .catrail{grid-template-columns:repeat(2,1fr)}.benefits2{grid-template-columns:1fr}.benefit2{border-left:0;border-bottom:1px solid #e0d6c5}
 .featured .grid{grid-template-columns:repeat(2,1fr);gap:10px}.featured .card .row{flex-wrap:wrap;gap:8px}.featured .card .row b{width:100%}.featured .card .row .small{flex:1}

function lowStockLimit(){let n=Number(localStorage.mrLowStock||3);return Number.isFinite(n)&&n>=0?n:3}function setLowStockLimit(v){localStorage.mrLowStock=String(Math.max(0,Number(v)||0));render();announce('Umbral de inventario actualizado')}
function updateSeller(id,key,v){let s=sellerData();s[id][key]=v;localStorage.mrSellers=JSON.stringify(s);render();announce('Proveedor actualizado')}
function updateCommerce(id,key,v){let d=commerceData(),n=Math.max(0,Number(v)||0);d[id][key]=n;localStorage.mrCommerce=JSON.stringify(d);render();announce('Datos comerciales actualizados')}
function orderStatusFilter(v){document.querySelectorAll('[data-order-status]').forEach(e=>e.hidden=v!=='Todos'&&e.dataset.orderStatus!==v);announce(v==='Todos'?'Mostrando todos los pedidos':'Filtro '+v+' aplicado')}
function orderDetails(i){let os=[];try{os=JSON.parse(localStorage.mrOrders||'[]')}catch{};let o=os[i];if(!o)return '';let d=o.customer||{};return '<div class="delivery"><b>Cliente y entrega</b><p>'+[d.name,d.phone].filter(Boolean).join(' · ')+'</p><p>'+[d.delivery,d.payment].filter(Boolean).join(' · ')+'</p>'+(d.address?'<p><b>Dirección:</b> '+d.address+(d.reference?' · Referencia: '+d.reference:'')+'</p>':'')+'</div>'}
function orderSearch(){applyOrderFilters()}
function setOrderStatus(i,v){let os=[];try{os=JSON.parse(localStorage.mrOrders||'[]')}catch{};if(!os[i])return;os[i].status=v;localStorage.mrOrders=JSON.stringify(os);render();announce('Estado del pedido actualizado')}
function adminView(){let sellers=sellerData(),commerce=commerceData();let os=[];try{os=JSON.parse(localStorage.mrOrders||'[]')}catch{};let units=os.reduce((s,o)=>s+(o.items||[]).reduce((a,x)=>a+x.q,0),0),sales=os.reduce((s,o)=>s+(o.items||[]).reduce((a,x)=>{let p=products.find(y=>y.id===x.id);return a+(p?p.price*x.q:0)},0),0);let stock=stockData(),limit=lowStockLimit(),inv=inventorySummary(),gross=products.reduce((s,p)=>s+Math.max(0,p.price-commerce[p.id].cost),0),low=products.filter(p=>stock[p.id]<=limit),pending=os.filter(o=>!['Entregado','Cancelado'].includes(o.status));return '<section><div class="head"><div><div class="eyebrow">Control Center</div><h2>Operación MR עדולם</h2><p>Vista inicial para administrar la operación comercial.</p></div></div><div class="metrics"><div class="metric"><span>Stock bajo</span><b>'+low.length+'</b></div><div class="metric"><span>Pedidos activos</span><b>'+pending.length+'</b></div><div class="metric"><span>Productos</span><b>'+products.length+'</b></div><div class="metric"><span>Pedidos</span><b>'+os.length+'</b></div><div class="metric"><span>Ventas registradas</span><b>'+money(sales)+'</b></div><div class="metric"><span>Margen catálogo</span><b>'+money(gross)+'</b></div></div>'+(low.length?'<div class="panel" style="margin-bottom:18px"><div class="eyebrow">Atención</div><div class="row"><h3>Alertas de inventario</h3><div class="admin-actions"><label><span class="meta">Buscar producto</span><input id="inventorySearch" class="qty" type="search" placeholder="Nombre o categoría" aria-label="Buscar producto en inventario" oninput="inventorySearch()"></label><label><span class="meta">Ver inventario</span><select id="inventoryStatus" class="qty" aria-label="Filtrar inventario" onchange="inventoryFilter()"><option>Todos</option><option>Bajo</option><option>Agotado</option><option>Disponible</option></select></label><label><span class="meta">Alertar cuando stock ≤</span><input class="qty" style="width:82px" type="number" min="0" value="'+limit+'" onchange="setLowStockLimit(this.value)"></label></div></div>'+low.map(p=>'<div class="row cart-line"><span><b>'+p.name+'</b><br><span class="meta">'+p.dept+'</span></span><span class="inventory-status low">'+stock[p.id]+' unidades</span></div>').join('')+'</div>':'')+'<div class="panel"><h3>Inventario y catálogo</h3><p id="inventoryResults" class="results" role="status">'+products.length+' productos visibles</p>'+products.map(p=>'<div class="row cart-line" data-stock-state="'+((stock[p.id]||0)===0?'Agotado':(stock[p.id]||0)<=limit?'Bajo':'Disponible')+'"><span><b>'+p.name+'</b><br><span class="meta">'+p.dept+' · '+money(p.price)+' · '+sellers[p.id].type+'</span><br><span class="meta">Costo '+money(commerce[p.id].cost)+' · Margen '+Math.round((p.price-commerce[p.id].cost)/p.price*100)+'% · Comisión '+commerce[p.id].commission+'%</span><div class="admin-actions" style="margin-top:8px"><label><span class="meta">Tipo</span><select class="qty" onchange="updateSeller(\''+p.id+'\',\'type\',this.value)">'+['MR עדולם','Marca asociada','Proveedor externo'].map(v=>'<option '+(sellers[p.id].type===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label><span class="meta">Origen</span><input class="qty" style="width:130px" value="'+sellers[p.id].origin+'" onchange="updateSeller(\''+p.id+'\',\'origin\',this.value.trim()||\'Sin definir\')"></label><label><span class="meta">Costo</span><input class="qty" style="width:100px" type="number" min="0" value="'+commerce[p.id].cost+'" onchange="updateCommerce(\''+p.id+'\',\'cost\',this.value)"></label><label><span class="meta">Comisión %</span><input class="qty" style="width:86px" type="number" min="0" max="100" value="'+commerce[p.id].commission+'" onchange="updateCommerce(\''+p.id+'\',\'commission\',this.value)"></label></div></span><div class="admin-actions"><span class="inventory-status '+(stock[p.id]<=limit?'low':'ok')+'">'+stock[p.id]+' en stock'+(stock[p.id]<=limit?' · Bajo':'')+'</span><button class="small" onclick="adjustStock(\''+p.id+'\',-1)" aria-label="Reducir stock de '+p.name+'">−</button><button class="small" onclick="adjustStock(\''+p.id+'\',1)" aria-label="Aumentar stock de '+p.name+'">+</button></div></div>').join('')+'</div>'+(os.length?'<div class="panel" style="margin-top:18px"><div class="row"><h3>Gestión de pedidos</h3><div class="admin-actions"><label><span class="meta">Buscar pedido</span><input class="qty" id="orderSearch" type="search" placeholder="ID o cliente" aria-label="Buscar pedido" oninput="orderSearch()"></label><label><span class="meta">Filtrar estado</span><select id="orderStatus" class="qty" aria-label="Filtrar pedidos por estado" onchange="orderStatusFilter()">'+['Todos','Recibido','Preparando','Listo','En camino','Entregado','Cancelado'].map(s=>'<option>'+s+'</option>').join('')+'</select></label></div></div><p id="orderResults" class="results" role="status">'+os.length+' pedidos visibles</p>'+os.map((o,i)=>'<div class="row cart-line" data-order-status="'+o.status+'"><span><b>'+o.id+'</b><br><span class="meta">'+new Date(o.date).toLocaleDateString('es-HN')+' · '+(o.customer?.name||'Cliente')+' · '+(o.customer?.phone||'Sin teléfono')+'</span></span><label><span class="meta">Estado</span><button class="small" onclick="this.closest(\'[data-order-status]\').querySelector(\'.admin-detail\').hidden=!this.closest(\'[data-order-status]\').querySelector(\'.admin-detail\').hidden">Detalle</button><select class="qty" aria-label="Estado de '+o.id+'" onchange="setOrderStatus('+i+',this.value)">'+['Recibido','Preparando','Listo','En camino','Entregado','Cancelado'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><div class="admin-detail" hidden style="flex-basis:100%">'+orderDetails(i)+'</div></div>').join('')+'</div>':'')+'</section>'}
function accountView(){let f=favs(),os=[];try{os=JSON.parse(localStorage.mrOrders||'[]')}catch{};return '<section><div class="head"><div><div class="eyebrow">Mi cuenta</div><h2>Tu espacio MR עדולם</h2><p>Compras y productos guardados en un solo lugar.</p></div></div><div class="metrics"><div class="metric"><span>Pedidos</span><b>'+os.length+'</b></div><div class="metric"><span>Favoritos</span><b>'+f.length+'</b></div><div class="metric"><span>Pedidos activos</span><b>'+os.filter(o=>!['Entregado','Cancelado'].includes(o.status)).length+'</b></div><div class="metric"><span>Entregados</span><b>'+os.filter(o=>o.status==='Entregado').length+'</b></div></div><div class="panel"><h3>Favoritos</h3>'+(f.length?cards(products.filter(p=>f.includes(p.id))):'<div class="empty"><p>Aún no has guardado productos.</p><button class="small" onclick="go(\'catalog\')">Explorar catálogo</button></div>')+'</div><div class="panel" style="margin-top:18px"><h3>Accesos rápidos</h3><div class="product-actions"><button class="small" onclick="go(\'orders\')">Mis pedidos</button><button class="small" onclick="go(\'cart\')">Mi carrito</button><button class="small" onclick="go(\'catalog\')">Catálogo</button></div></div></section>'}
function commerceData(){let d={};try{d=JSON.parse(localStorage.mrCommerce||'{}')}catch{};products.forEach((p,i)=>{if(!d[p.id]){let cost=Math.round(p.price*(i%3===0?.55:.62));d[p.id]={cost,commission:i%3===0?0:12,currency:'HNL'}}});localStorage.mrCommerce=JSON.stringify(d);return d}
function sellerData(){let s={};try{s=JSON.parse(localStorage.mrSellers||'{}')}catch{};products.forEach((p,i)=>{if(!s[p.id])s[p.id]=i%3===0?{type:'MR עדולם',origin:'Honduras'}:i%3===1?{type:'Marca asociada',origin:'Internacional'}:{type:'Proveedor externo',origin:'Internacional'}});localStorage.mrSellers=JSON.stringify(s);return s}
function marketView(){let second=products.filter(p=>['Ropa','Accesorios','Calzado'].includes(p.dept)),brands=products.filter(p=>['Belleza','Tecnología','Deportes'].includes(p.dept));return '<section><div class="head"><div><div class="eyebrow">Marketplace</div><h2>Más opciones, una sola experiencia</h2><p>Base para integrar productos propios, terceros y segunda mano.</p></div></div><div class="panel"><h3>Segunda Mano</h3><p>Selección reutilizable preparada para ropa, accesorios y otros artículos.</p>'+cards(second)+'</div><div class="panel" style="margin-top:18px"><h3>Marcas y terceros</h3><p>Espacio preparado para ampliar el catálogo con vendedores y proveedores externos.</p>'+cards(brands)+'</div><div class="panel" style="margin-top:18px"><h3>Modelo comercial</h3><div class="benefits" style="margin-top:10px"><div class="benefit"><b>Productos propios</b><span>Inventario MR עדולם</span></div><div class="benefit"><b>Terceros</b><span>Catálogo ampliado</span></div><div class="benefit"><b>Segunda mano</b><span>Reutilización y valor</span></div><div class="benefit"><b>Comisiones</b><span>Preparado para marketplace</span></div><div class="benefit"><b>Más países</b><span>Abierto a nuevos mercados</span></div></div></div></section>'}
function simple(title,text){return '<div class="panel"><h2>'+title+'</h2><p>'+text+'</p></div>'}
function syncNav(p){document.querySelectorAll('nav a').forEach(a=>{a.removeAttribute('aria-current');let h=a.getAttribute('href')||'';if((!p&&h==='#/')||(p&&h==='#/'+p))a.setAttribute('aria-current','page')})}function render(){count();let p=location.hash.replace('#/','');crownHook();app.innerHTML=!p?home():p==='catalog'?catalog():p.startsWith('product/')?productView(p.split('/')[1]):p==='cart'?cartView():p==='checkout'?checkoutView():p==='review'?reviewView():p==='success'?successView():p==='market'?marketView():p==='orders'?ordersView():p==='admin'?adminView():accountView();crownMount()}
let crownOff=null;function crownHook(){if(crownOff){crownOff();crownOff=null}}function crownMount(){const box=document.querySelector("#crown3d");if(!box)return;box.addEventListener("pointerdown",()=>box.classList.add("touched"),{once:true});const go=()=>{crownOff=window.mrCrown.mount(box,{base:"/assets/"})};window.mrCrown?go():addEventListener("mrcrown:ready",go,{once:true})}
async function syncCatalog(){try{const r=await fetch('/api/v1/products?status=active');if(!r.ok)return;const j=await r.json();const d=j.data;if(!Array.isArray(d)||!d.length)return;const st=JSON.parse(localStorage.mrStock||'{}');const list=d.map(x=>({id:'c'+x.id,name:x.name,dept:x.category||'Otros',price:Number(x.price)||0,icon:'🛍️'}));products.splice(0,products.length,...list);d.forEach(x=>{if(st['c'+x.id]==null)st['c'+x.id]=Number(x.stock)||0});localStorage.mrStock=JSON.stringify(st);const ids=new Set(list.map(p=>p.id));save(cart().filter(x=>ids.has(x.id)));render()}catch{}}
